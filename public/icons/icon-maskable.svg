<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Subtle Islamic 8-point geometric star pattern behind Quran -->
  <g opacity="0.15" stroke="url(#gold)" stroke-width="4" fill="none">
    <rect x="156" y="156" width="200" height="200" rx="20" />
    <rect x="156" y="156" width="200" height="200" rx="20" transform="rotate(45 256 256)" />
    <circle cx="256" cy="256" r="140" />
  </g>

  <!-- Decorative Outer Ring -->
  <circle cx="256" cy="256" r="216" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" fill="none" />

  <!-- Quran Book Stand / Rehal Silhouette & Open Quran -->
  <g filter="url(#shadow)" transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Open Book Pages -->
    <path d="M 120 300 Q 190 260 256 280 Q 322 260 392 300 L 392 180 Q 322 140 256 160 Q 190 140 120 180 Z" fill="#faf8f5" />
    
    <!-- Gold Ribbon / Bookmark in center -->
    <path d="M 252 160 L 260 160 L 260 340 L 256 332 L 252 340 Z" fill="url(#gold)" />

    <!-- Quran Arabic Scripture lines decorative -->
    <line x1="150" y1="200" x2="230" y2="185" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="225" x2="235" y2="210" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="155" y1="250" x2="225" y2="238" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <line x1="282" y1="185" x2="362" y2="200" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="277" y1="210" x2="367" y2="225" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="287" y1="238" x2="357" y2="250" stroke="#065f46" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Sound waves / Headphones / Audio symbol arching over Quran -->
    <path d="M 160 140 A 130 130 0 0 1 352 140" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
    <path d="M 185 155 A 95 95 0 0 1 327 155" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" opacity="0.8" />

    <!-- Play symbol in gold badge at bottom -->
    <circle cx="256" cy="390" r="38" fill="url(#gold)" />
    <polygon points="250,374 270,390 250,406" fill="#064e3b" />
  </g>
</svg>
